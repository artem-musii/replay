<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'"
    />
    <meta name="theme-color" content="#15302d" />
    <title>Page not found — REPLAY</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #15302d;
        background: #f6f2e9;
      }
      main {
        width: min(560px, 100%);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #c9c9bd;
        border-radius: 18px;
        background: #fffdf8;
        box-shadow: 0 18px 50px rgb(21 48 45 / 9%);
      }
      p:first-child {
        margin: 0 0 16px;
        color: #60706d;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      p {
        max-width: 44ch;
        color: #54625f;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 10px;
        padding: 0 18px;
        border-radius: 10px;
        color: #fff;
        background: #15302d;
        font-weight: 720;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #ee7c68;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>REPLAY · 404</p>
      <h1>This route is not in the case file.</h1>
      <p>
        The address may be incomplete. Return to REPLAY to open the deterministic demo or resume a
        case stored in this browser.
      </p>
      <a href="/" data-replay-base-path>Return to REPLAY</a>
    </main>
  </body>
</html>
